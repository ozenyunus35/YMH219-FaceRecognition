name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build YMH219-FaceRecognition.sln -c Release
      - name: Test (algılama, tanıma, değerlendirme)
        run: dotnet test YMH219-FaceRecognition.sln -c Release --no-build --logger "console;verbosity=detailed"
